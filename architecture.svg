<svg width="680" height="620" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="620" fill="#ffffff"/>

  <!-- Input -->
  <rect x="240" y="24" width="200" height="44" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="340" y="46" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Any file</text>
  <line x1="340" y1="68" x2="340" y2="96" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Analysis layer -->
  <rect x="50" y="96" width="580" height="182" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="340" y="120" text-anchor="middle" dominant-baseline="central" fill="#085041">Analysis layer</text>

  <rect x="70"  y="134" width="130" height="56" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="135" y="155" text-anchor="middle" dominant-baseline="central" fill="#04342C">Sampler</text>
  <text font-family="sans-serif" font-size="12" x="135" y="174" text-anchor="middle" dominant-baseline="central" fill="#085041">Representative slice</text>

  <rect x="220" y="134" width="130" height="56" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="285" y="155" text-anchor="middle" dominant-baseline="central" fill="#04342C">Stats</text>
  <text font-family="sans-serif" font-size="12" x="285" y="174" text-anchor="middle" dominant-baseline="central" fill="#085041">Entropy, byte freq</text>

  <rect x="370" y="134" width="130" height="56" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="435" y="155" text-anchor="middle" dominant-baseline="central" fill="#04342C">File type</text>
  <text font-family="sans-serif" font-size="12" x="435" y="174" text-anchor="middle" dominant-baseline="central" fill="#085041">Magic bytes</text>

  <rect x="520" y="134" width="90"  height="56" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="565" y="155" text-anchor="middle" dominant-baseline="central" fill="#04342C">Errors</text>
  <text font-family="sans-serif" font-size="12" x="565" y="174" text-anchor="middle" dominant-baseline="central" fill="#085041">AlpressError</text>

  <rect x="140" y="210" width="400" height="44" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="340" y="232" text-anchor="middle" dominant-baseline="central" fill="#04342C">FileProfile</text>

  <line x1="340" y1="278" x2="340" y2="306" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision engine -->
  <rect x="50" y="306" width="580" height="64" rx="16" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="340" y="330" text-anchor="middle" dominant-baseline="central" fill="#412402">Decision engine</text>
  <text font-family="sans-serif" font-size="12" x="340" y="352" text-anchor="middle" dominant-baseline="central" fill="#633806">Entropy + file type + size → best algorithm</text>

  <line x1="340" y1="370" x2="340" y2="398" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Compression layer -->
  <rect x="50" y="398" width="580" height="154" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="340" y="422" text-anchor="middle" dominant-baseline="central" fill="#26215C">Compression layer</text>

  <rect x="70"  y="438" width="150" height="56" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="145" y="460" text-anchor="middle" dominant-baseline="central" fill="#26215C">Gzip</text>
  <text font-family="sans-serif" font-size="12" x="145" y="479" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Small files, text</text>

  <rect x="240" y="438" width="150" height="56" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="315" y="460" text-anchor="middle" dominant-baseline="central" fill="#26215C">LZ4</text>
  <text font-family="sans-serif" font-size="12" x="315" y="479" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Large files, speed</text>

  <rect x="410" y="438" width="150" height="56" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="485" y="460" text-anchor="middle" dominant-baseline="central" fill="#26215C">Zstd</text>
  <text font-family="sans-serif" font-size="12" x="485" y="479" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Best ratio choice</text>

  <rect x="570" y="438" width="50"  height="56" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="595" y="460" text-anchor="middle" dominant-baseline="central" fill="#26215C">Skip</text>
  <text font-family="sans-serif" font-size="12" x="595" y="479" text-anchor="middle" dominant-baseline="central" fill="#3C3489">High entropy</text>

  <rect x="120" y="514" width="420" height="24" rx="6" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="12" x="330" y="526" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Header (magic · algo · size · CRC32)  +  compressed data</text>

  <line x1="340" y1="552" x2="340" y2="576" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="240" y="576" width="200" height="44" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="340" y="598" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">.alp file on disk</text>
</svg>