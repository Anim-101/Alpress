[package]
name = "alpress"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "alpress"
path = "src/main.rs"

[dependencies]
flate2    = "1.0"    # Gzip
lz4       = "1.24"   # LZ4
zstd      = "0.13"   # Zstd
crc32fast = "1.4"    # Checksum
clap      = { version = "4.5", features = ["derive"] } # CLI — NEW Phase 7