[package]
name = "alpress"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "alpress"
path = "src/main.rs"

[dependencies]
flate2    = "1.0"
lz4       = "1.24"
zstd      = "0.13"
crc32fast = "1.4"
clap      = { version = "4.5", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }